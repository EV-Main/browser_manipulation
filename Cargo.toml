cargo-features = ["codegen-backend"]

[workspace]
members = ["browser_manipulation", "browser_manipulation_*"]
default-members = ["browser_manipulation"]
resolver = "3"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"
doc_lazy_continuation = "allow"
get_first = "allow"
get_last_with_len = "allow"
manual_is_multiple_of = "allow"
if_not_else = "warn"
integer_division = "warn"

[workspace.lints.rust]
stable_features = "allow"
unused_features = "allow"

[workspace.lints.cargo]
non_kebab_case_bins = "allow"

[workspace.dependencies]
base64 = "0.23"
bon = "3.10"
crc32fast = "1.5"
derive_more = "2"
futures = "0.3"
jiff = "0.2"
miette = { version = "^7.6.0", features = ["fancy", "serde", "syntect-highlighter"] }
playwright-rs = { version = "=0.19.0", default-features = false, features = ["macros", "ring", "route-service", "rustls-tls-native-roots"] }
png = "0.18"
rand = "0.9"
serde = "1"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.package]
repository = "https://github.com/EV-Main/browser_manipulation"
