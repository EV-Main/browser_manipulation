[package]
name = "browser_manipulation"
version = "0.4.6"
edition = "2024"
description = "One Playwright-protocol browser framework: patchright driver, human-shaped Motion, capture-on-failure"
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-Main/browser_manipulation"

[dependencies]
base64.workspace = true
bon.workspace = true
crc32fast.workspace = true
derive_more = { workspace = true, features = ["display"] }
futures.workspace = true
jiff.workspace = true
miette.workspace = true
playwright-rs.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
playwright-rs.workspace = true
png.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "../tests/integration/main.rs"
